# This fragment supplements the existing SSH policy. The deployment account
# cannot obtain a shell, port forwarding, a TTY, or arbitrary sudo access.

Match User greenmarket-deploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    PermitUserRC no
    AllowTcpForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    PermitOpen none
    AllowAgentForwarding no
    ForceCommand /usr/local/libexec/greenmarket-staging-deploy
