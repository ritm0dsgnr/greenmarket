name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting-sensitive files
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA"
          else
            git diff-tree --check --no-commit-id -r "$GITHUB_SHA"
          fi

      - name: Run application checks
        run: npm run check

      - name: Audit dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in 1 2 3 4 5 6 7 8; do
            set +e
            output="$(npm audit --audit-level=high --engine-strict --fetch-retries=0 --fetch-timeout=20000 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"

            if test "$status" -eq 0; then
              exit 0
            fi

            if printf '%s\n' "$output" | grep -Eq 'audit endpoint returned an error|Service Unavailable|ECONNRESET|ETIMEDOUT|EAI_AGAIN|socket hang up'; then
              if test "$attempt" -lt 8; then
                echo "npm audit registry unavailable (attempt ${attempt}/8); retrying in 20s..." >&2
                sleep 20
                continue
              fi
            fi

            exit "$status"
          done

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
